{% if retention and retention.show_warning and retention_prominent %}
<section class="retention-notice tone-attention" id="matter-retention" aria-label="Matter check-in">
  <div class="retention-notice-copy"><span><strong>{{ retention.label }}</strong><small>{{ retention.detail }}</small></span></div>
  <div class="retention-notice-actions">
    {% if is_matter_owner or is_administrator %}
    <form method="post" action="/matters/{{ matter.slug }}/check-in" data-working-form>
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button class="button button-secondary" type="submit">Keep ongoing · check in after 90 days</button>
    </form>
    {% else %}<span>Ask the matter owner to review this check-in.</span>{% endif %}
  </div>
</section>
{% endif %}
