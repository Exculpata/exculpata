# Explicit local-account profile: only the canonical account directory is writable.
services:
  app:
    volumes:
      - type: bind
        source: ${EXCULPATA_LOCAL_ACCOUNT_ROOT:-${RECORDBENCH_LOCAL_ACCOUNT_ROOT:-}}
        target: /var/lib/recordbench-accounts
  account-admin:
    volumes:
      - type: bind
        source: ${EXCULPATA_SECRETS_ROOT:-${RECORDBENCH_SECRETS_ROOT:-}}
        target: /run/recordbench-secrets
        read_only: true
      - type: bind
        source: ${EXCULPATA_LOCAL_ACCOUNT_ROOT:-${RECORDBENCH_LOCAL_ACCOUNT_ROOT:-}}
        target: /var/lib/recordbench-accounts
