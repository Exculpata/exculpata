[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exculpata-transcription-v2"
version = "0.1.0b1"
description = "Local, review-first transcription and diarization with ephemeral delivery"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
license-files = ["licenses/*.txt"]
dependencies = [
  "fastapi>=0.141.1,<0.143",
  "starlette>=1.3.1,<2",
  "python-multipart>=0.0.20,<1",
  "requests>=2.31,<3",
  "streamlit>=1.51,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
# Installed only in the isolated worker environment. Model weights are staged
# separately after license review; importing the API/UI does not import ML code.
ml = [
  # The GPU worker lock and compatibility wheel target CPython 3.11 on Linux x86-64.
  "onnxruntime>=1.30,<1.31",
  "whisperx==3.8.6+recordbench.1",
]
dev = [
  "pytest>=9.0.3,<10",
  "httpx>=0.27,<1",
]

[project.scripts]
transcription-v2 = "transcription_v2.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
