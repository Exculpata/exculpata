# Proxy destination authority is supplied by the selected application configuration.

[compose]
"compose.kerberos.yaml" = '''
{
  "networks": {},
  "services": {
    "app": {},
    "gateway": {},
    "kerberos-proxy": {
      "cap_add": [
        "CHOWN",
        "DAC_OVERRIDE",
        "KILL",
        "SETGID",
        "SETUID"
      ],
      "cap_drop": [
        "ALL"
      ],
      "networks": [
        "services"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ]
    }
  }
}
'''
"compose.local-accounts.yaml" = '''
{
  "networks": {},
  "services": {
    "account-admin": {},
    "app": {}
  }
}
'''
"compose.yaml" = '''
{
  "networks": {
    "app-egress": {
      "internal": true
    },
    "front": null,
    "models": {
      "internal": true
    },
