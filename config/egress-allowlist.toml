      "internal": true
    },
    "updates": null
  },
  "services": {
    "account-admin": {
      "cap_drop": [
        "ALL"
      ],
      "network_mode": "none",
      "security_opt": [
        "no-new-privileges:true"
      ]
    },
    "app": {
      "cap_drop": [
        "ALL"
      ],
      "networks": [
        "app-egress",
        "services",
        "models"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ]
    },
    "clamav": {
      "cap_add": [
        "CHOWN",
        "DAC_OVERRIDE",
        "FOWNER",
        "SETGID",
        "SETUID"
      ],
      "cap_drop": [
