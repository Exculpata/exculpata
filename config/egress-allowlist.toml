        "front"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ]
    },
    "gateway": {
      "cap_add": [
        "CHOWN",
        "DAC_OVERRIDE",
        "NET_BIND_SERVICE",
        "SETGID",
        "SETUID"
      ],
      "cap_drop": [
        "ALL"
      ],
      "networks": [
        "front",
        "services"
      ],
      "ports": [
