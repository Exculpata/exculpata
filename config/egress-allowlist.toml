      ]
    },
    "gateway": {},
    "kerberos-proxy": {
      "cap_add": [
        "CHOWN",
        "DAC_OVERRIDE",
        "KILL",
        "SETGID",
        "SETUID"
      ],
      "cap_drop": [
        "ALL"
      ],
      "networks": [
        "services"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "volumes": [
        "${EXCULPATA_SECRETS_ROOT:-${RECORDBENCH_SECRETS_ROOT:-}}:/run/recordbench-secrets:ro",
        "/etc/krb5.conf:/etc/krb5.conf:ro"
      ]
    }
  },
  "volumes": {}
}
'''
