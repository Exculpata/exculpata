"compose.yaml" = '''
{
  "networks": {
    "app-egress": {
      "internal": true
    },
    "front": null,
    "models": {
      "internal": true
    },
    "services": {
      "internal": true
    },
    "updates": null
  },
  "services": {
    "account-admin": {
      "cap_drop": [
        "ALL"
      ],
      "network_mode": "none",
      "security_opt": [
        "no-new-privileges:true"
      ],
      "volumes": [
        {
          "source": "${EXCULPATA_SECRETS_ROOT:-${RECORDBENCH_SECRETS_ROOT:-}}",
          "target": "/run/recordbench-secrets",
          "type": "bind"
        },
        {
          "source": "${EXCULPATA_STORAGE_ROOT:-${RECORDBENCH_STORAGE_ROOT:-}}",
          "target": "/var/lib/recordbench/matter-storage",
          "type": "bind"
        }
      ]
    },
    "app": {
      "cap_drop": [
        "ALL"
      ],
      "dns": [
        "127.0.0.1"
      ],
      "dns_search": [
        "."
      ],
      "env_file": [
        "${EXCULPATA_CONFIG_ROOT:-${RECORDBENCH_CONFIG_ROOT:-}}/${EXCULPATA_APP_ENV_FILE:-${RECORDBENCH_APP_ENV_FILE:-recordbench.env}}"
      ],
      "networks": [
        "app-egress",
        "services",
        "models"
      ],
      "proxy_environment": {
        "ALL_PROXY": "http://egress-proxy:3128",
        "CASE_INTELLIGENCE_OIDC_PROXY": "http://egress-proxy:3128",
        "HTTPS_PROXY": "http://egress-proxy:3128",
        "HTTP_PROXY": "http://egress-proxy:3128",
        "NO_PROXY": "",
        "all_proxy": "http://egress-proxy:3128",
        "http_proxy": "http://egress-proxy:3128",
        "https_proxy": "http://egress-proxy:3128",
        "no_proxy": ""
      },
      "security_opt": [
        "no-new-privileges:true"
      ],
      "volumes": [
        {
          "source": "${EXCULPATA_RUNTIME_ROOT:-${RECORDBENCH_RUNTIME_ROOT:-}}",
          "target": "/var/lib/recordbench/runtime",
          "type": "bind"
        },
        {
          "source": "${EXCULPATA_STORAGE_ROOT:-${RECORDBENCH_STORAGE_ROOT:-}}",
          "target": "/var/lib/recordbench/matter-storage",
          "type": "bind"
        },
        {
          "source": "${EXCULPATA_STATE_ROOT:-${RECORDBENCH_STATE_ROOT:-}}",
          "target": "/var/lib/recordbench/state",
          "type": "bind"
        },
        {
          "read_only": true,
          "source": "${EXCULPATA_SECRETS_ROOT:-${RECORDBENCH_SECRETS_ROOT:-}}",
          "target": "/run/recordbench-secrets",
          "type": "bind"
        }
      ]
    },
    "clamav": {
      "cap_add": [
        "CHOWN",
        "DAC_OVERRIDE",
        "FOWNER",
        "SETGID",
        "SETUID"
      ],
      "cap_drop": [
        "ALL"
      ],
      "dns": [
        "127.0.0.1"
      ],
      "dns_search": [
        "."
      ],
      "networks": [
        "services"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "volumes": [
        "clamav-signatures:/var/lib/clamav"
      ]
    },
    "clamav-updater": {
      "cap_add": [
        "CHOWN",
        "DAC_OVERRIDE",
        "FOWNER",
        "SETGID",
        "SETUID"
      ],
      "cap_drop": [
        "ALL"
      ],
      "networks": [
        "updates"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "volumes": [
        "clamav-signatures:/var/lib/clamav"
      ]
    },
    "egress-proxy": {
      "cap_drop": [
        "ALL"
      ],
      "networks": [
        "app-egress",
        "front"
      ],
      "proxy_environment": {
        "OIDC_ISSUER": "${OIDC_EGRESS_ISSUER:-}",
        "OIDC_ISSUER_PINS": "${OIDC_EGRESS_PINS:-}"
      },
      "security_opt": [
        "no-new-privileges:true"
      ]
    },
    "gateway": {
      "cap_add": [
        "CHOWN",
        "DAC_OVERRIDE",
        "NET_BIND_SERVICE",
        "SETGID",
        "SETUID"
      ],
      "cap_drop": [
        "ALL"
      ],
      "networks": [
        "front",
        "services"
      ],
      "ports": [
        "${EXCULPATA_BIND_ADDRESS:-${RECORDBENCH_BIND_ADDRESS:-127.0.0.1}}:${EXCULPATA_HTTPS_PORT:-${RECORDBENCH_HTTPS_PORT:-8443}}:8443"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "volumes": [
        "./deploy/gateway/default.conf.template:/etc/nginx/templates/default.conf.template:ro",
        "${EXCULPATA_TLS_CERT:-${RECORDBENCH_TLS_CERT:-}}:/run/tls/tls.crt:ro",
        "${EXCULPATA_TLS_KEY:-${RECORDBENCH_TLS_KEY:-}}:/run/tls/tls.key:ro"
      ]
    },
    "generator": {
      "dns": [
        "127.0.0.1"
      ],
      "dns_search": [
        "."
      ],
      "networks": [
        "models"
      ],
      "volumes": [
        {
          "read_only": true,
          "source": "${EXCULPATA_MODEL_ROOT:-${RECORDBENCH_MODEL_ROOT:-}}",
          "target": "/models",
          "type": "bind"
        }
      ]
    },
    "model-stager": {
      "cap_drop": [
        "ALL"
      ],
      "networks": [
        "front"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "volumes": [
        ".:/workspace:ro",
        {
          "source": "${EXCULPATA_MODEL_ROOT:-${RECORDBENCH_MODEL_ROOT:-}}",
          "target": "/models",
          "type": "bind"
        }
      ]
    },
    "postgres": {
      "dns": [
        "127.0.0.1"
      ],
      "dns_search": [
        "."
      ],
      "networks": [
        "services"
      ],
      "volumes": [
        "postgres-data:/var/lib/postgresql/data"
      ]
    },
    "retrieval": {
      "cap_drop": [
        "ALL"
      ],
      "dns": [
        "127.0.0.1"
      ],
      "dns_search": [
        "."
      ],
      "networks": [
        "models"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "volumes": [
        {
          "read_only": true,
          "source": "${EXCULPATA_MODEL_ROOT:-${RECORDBENCH_MODEL_ROOT:-}}",
          "target": "/models",
          "type": "bind"
        }
      ]
    },
    "transcription-api": {
      "cap_drop": [
        "ALL"
      ],
      "dns": [
        "127.0.0.1"
      ],
      "dns_search": [
        "."
      ],
      "env_file": [
        "${EXCULPATA_CONFIG_ROOT:-${RECORDBENCH_CONFIG_ROOT:-}}/transcription.env"
      ],
      "networks": [
        "services"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "volumes": [
        {
          "source": "${EXCULPATA_TRANSCRIPTION_ROOT:-${RECORDBENCH_TRANSCRIPTION_ROOT:-}}",
          "target": "/var/lib/recordbench/transcription",
          "type": "bind"
        },
        {
          "read_only": true,
          "source": "${EXCULPATA_SECRETS_ROOT:-${RECORDBENCH_SECRETS_ROOT:-}}",
          "target": "/run/recordbench-secrets",
          "type": "bind"
        },
        {
          "read_only": true,
          "source": "${EXCULPATA_MODEL_ROOT:-${RECORDBENCH_MODEL_ROOT:-}}",
          "target": "/models",
          "type": "bind"
        }
      ]
    },
    "transcription-cleanup": {
      "env_file": [
        "${EXCULPATA_CONFIG_ROOT:-${RECORDBENCH_CONFIG_ROOT:-}}/transcription.env"
      ],
      "network_mode": "none",
      "volumes": [
        "${EXCULPATA_TRANSCRIPTION_ROOT:-${RECORDBENCH_TRANSCRIPTION_ROOT:-}}:/var/lib/recordbench/transcription",
        "${EXCULPATA_SECRETS_ROOT:-${RECORDBENCH_SECRETS_ROOT:-}}:/run/recordbench-secrets:ro",
        "${EXCULPATA_MODEL_ROOT:-${RECORDBENCH_MODEL_ROOT:-}}:/models:ro"
      ]
    },
    "transcription-cleanup-daemon": {
      "cap_drop": [
        "ALL"
      ],
      "env_file": [
        "${EXCULPATA_CONFIG_ROOT:-${RECORDBENCH_CONFIG_ROOT:-}}/transcription.env"
      ],
      "network_mode": "none",
      "security_opt": [
        "no-new-privileges:true"
      ],
      "volumes": [
        "${EXCULPATA_TRANSCRIPTION_ROOT:-${RECORDBENCH_TRANSCRIPTION_ROOT:-}}:/var/lib/recordbench/transcription",
        "${EXCULPATA_SECRETS_ROOT:-${RECORDBENCH_SECRETS_ROOT:-}}:/run/recordbench-secrets:ro",
        "${EXCULPATA_MODEL_ROOT:-${RECORDBENCH_MODEL_ROOT:-}}:/models:ro"
      ]
    },
    "transcription-worker": {
      "cap_drop": [
        "ALL"
      ],
      "env_file": [
        "${EXCULPATA_CONFIG_ROOT:-${RECORDBENCH_CONFIG_ROOT:-}}/transcription.env"
      ],
      "network_mode": "none",
      "security_opt": [
        "no-new-privileges:true"
      ],
      "volumes": [
        {
          "source": "${EXCULPATA_TRANSCRIPTION_ROOT:-${RECORDBENCH_TRANSCRIPTION_ROOT:-}}",
          "target": "/var/lib/recordbench/transcription",
          "type": "bind"
        },
        {
          "read_only": true,
          "source": "${EXCULPATA_SECRETS_ROOT:-${RECORDBENCH_SECRETS_ROOT:-}}",
          "target": "/run/recordbench-secrets",
          "type": "bind"
        },
        {
          "read_only": true,
          "source": "${EXCULPATA_MODEL_ROOT:-${RECORDBENCH_MODEL_ROOT:-}}",
          "target": "/models",
          "type": "bind"
        }
      ]
    }
  },
  "volumes": {
    "clamav-signatures": null,
    "postgres-data": null
  }
}
