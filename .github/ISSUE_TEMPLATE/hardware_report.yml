name: Beta hardware report
description: Share how Exculpata runs on your hardware using synthetic data
labels: [hardware-report]
body:
  - type: markdown
    attributes:
      value: |
        ## Synthetic demo data only

        Use only the synthetic demo data when testing or reporting. Do not load
        client or case files to produce a report. This is public: omit hostnames,
        usernames, employer names, credentials, private paths and internal settings.
        Never paste production logs or environment dumps. Inspect attachments and
        their metadata too. Submit summaries rather than raw receipts.

        These ten fields map to COMPATIBILITY.md. GitHub supplies the Report URL
        when this issue is submitted. Big-GPU, multi-GPU and CPU-only reports are
        welcome; a report does not establish support or production readiness.
        The release reference matrix remains in docs/COMPATIBILITY.md.
  - type: textarea
    id: hardware
    attributes:
      label: Hardware (generic)
      description: Generic device type, CPU/core count, RAM and free disk; GPU models/count and VRAM per GPU. No machine names or identifying details. Say unknown where necessary.
      placeholder: Laptop, 16 GB RAM, no GPU (count 0, VRAM not applicable)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      description: Distribution, release and architecture only; omit hostnames.
    validations:
      required: true
  - type: input
    id: backend
    attributes:
      label: Backend
      description: Runtime and version (for example vLLM or Ollama); CPU-only if no model backend, unknown if not recorded.
    validations:
      required: true
  - type: textarea
    id: models
    attributes:
      label: Model + quantization
      description: Each model ID, exact revision and quantization/precision. Enter none if no models were used, or unknown for missing details.
    validations:
      required: true
  - type: input
    id: profile
    attributes:
      label: Profile
      description: Selected profile (portable, quality, other with its name, or none). Say unknown if not recorded.
    validations:
      required: true
  - type: input
    id: exculpata-version
    attributes:
      label: Exculpata version
      description: Exact release tag or full commit SHA tested; note any local changes.
    validations:
      required: true
  - type: dropdown
    id: install-result
    attributes:
      label: Install
      description: Partial means some intended steps completed; describe the boundary in Notes.
      options:
        - pass
        - fail
        - partial
    validations:
      required: true
  - type: dropdown
    id: doctor-result
    attributes:
      label: doctor
      options:
        - pass
        - fail
        - partial
        - not-run
        - not-recorded
    validations:
      required: true
  - type: textarea
    id: eval-summary
    attributes:
      label: Eval summary
      description: Command/mode, fixture fingerprint, counts and denominators, limits; explicitly say not run if absent. A zero exit is not a quality pass. Separate deterministic probes from installed-node or model evaluation.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Driver/CUDA versions (or not applicable), Docker/Compose versions, synthetic steps, results, timings with units and untested steps. Only generic wording; no logs, hostnames, addresses or identifying details.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy attestation
      description: Review every field and attachment, including metadata.
      options:
        - label: I used only synthetic demo data. This report and attachments contain no client or case files, credentials, hostnames, usernames, employer names or other identifying details.
          required: true
