name: Network isolation smoke

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  merge_group:
  schedule:
    - cron: "43 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: network-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  network-smoke:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'network-smoke')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install locked smoke harness dependencies
        run: python -m pip install --require-hashes -r requirements/network-smoke.lock
      - name: Exercise isolated synthetic OIDC and direct-egress denials
        env:
          RUN_NETWORK_SMOKE: "1"
          NETWORK_SMOKE_DOCKER_CONTEXT: default
          NETWORK_SMOKE_OUTPUT: network-smoke-results
        run: python -m pytest -q tests/test_relay_build_context_live.py tests/test_egress_proxy_live.py -o faulthandler_timeout=1200
      - name: Retain content-free smoke summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: network-smoke-summary
          path: network-smoke-results/summary.json
          if-no-files-found: warn
          retention-days: 7
