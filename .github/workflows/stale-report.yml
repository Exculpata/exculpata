name: Stale hygiene report

on:
  schedule:
    - cron: "47 3 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  measure:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Capture repository metadata
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          INPUT="$RUNNER_TEMP/stale-input.json"
          export INPUT
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path(os.environ["INPUT"]).write_text(json.dumps({"errors": []}))
          PY
          git for-each-ref --format='%(refname:strip=3)|%(committerdate:iso-strict)' refs/remotes/origin > "$RUNNER_TEMP/branches.txt" || true
          for endpoint in pulls issues actions/workflows; do
            gh api --paginate "repos/${GITHUB_REPOSITORY}/${endpoint}" > "$RUNNER_TEMP/${endpoint//\//-}.json" || true
          done
          python - "$RUNNER_TEMP" "$INPUT" <<'PY'
          import json, sys
          from pathlib import Path
          root, output = Path(sys.argv[1]), Path(sys.argv[2])
          data = {"errors": []}
          try:
              data["branches"] = [{"name": name, "updated_at": updated} for name, updated in
                                  (line.split("|", 1) for line in (root / "branches.txt").read_text().splitlines())
                                  if name != "HEAD"]
          except (OSError, ValueError) as error:
              data["errors"].append({"tool": "git", "error": f"branches: {error}"})
          for key, filename in {"pulls":"pulls.json", "issues":"issues.json", "workflows":"actions-workflows.json"}.items():
              try:
                  value = json.loads((root / filename).read_text() or "[]")
                  data[key] = value.get("workflows", value) if isinstance(value, dict) else value
              except (OSError, ValueError) as error:
                  data["errors"].append({"tool": "gh-api", "error": f"{key}: {error}"})
          data["workflow_files"] = [str(path) for path in Path(".github/workflows").glob("*.yml")]
          output.write_text(json.dumps(data))
          PY
      - name: Build stale report
        continue-on-error: true
        run: python scripts/hygiene_stale.py --input "$RUNNER_TEMP/stale-input.json" --output stale-report.json
      - name: Summarize
        if: always()
        run: |
          echo '## Stale hygiene report' >> "$GITHUB_STEP_SUMMARY"
          test -f stale-report.json && python -m json.tool stale-report.json >> "$GITHUB_STEP_SUMMARY" || echo 'Measurement did not produce a report.' >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: stale-report.json
          path: stale-report.json
          if-no-files-found: warn
          retention-days: 14
  file:
    needs: measure
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: stale-report.json
      - shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUBLICATION_DENY_TERMS: ${{ secrets.PUBLICATION_DENY_TERMS }}
        run: |
          umask 077
          deny="$RUNNER_TEMP/hygiene-deny"
          trap 'rm -f "$deny"' EXIT
          printf '%s' "$PUBLICATION_DENY_TERMS" > "$deny"
          unset PUBLICATION_DENY_TERMS
          prepare() {
            python3 scripts/hygiene_issue.py --report stale-report.json --issues "$RUNNER_TEMP/issues.json" --kind "$kind" --run "$GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID" --scanner scripts/publication-check.py --deny-file "$deny" --body "$RUNNER_TEMP/body.md" --decision "$RUNNER_TEMP/decision.json" --summary "$GITHUB_STEP_SUMMARY"
          }
          for kind in stale-branches stale-issues ghost-workflows; do
            gh issue list --repo "$GH_REPO" --state open --label automated-hygiene --limit 1000 --json number,title,body,labels,state > "$RUNNER_TEMP/issues.json"
            prepare
            if [ "$(jq -r .action "$RUNNER_TEMP/decision.json")" = skip ]; then continue; fi
            if ! gh label list --search automated-hygiene --limit 1000 --json name | jq -e 'any(.name == "automated-hygiene")' >/dev/null; then
              gh label create automated-hygiene --color ededed --description 'Automated repository hygiene reports'
              prepare
            fi
            case "$(jq -r .action "$RUNNER_TEMP/decision.json")" in
              create) gh issue create --repo "$GH_REPO" --title "$(jq -r .title "$RUNNER_TEMP/decision.json")" --label automated-hygiene --body-file "$RUNNER_TEMP/body.md" ;;
              edit) gh issue edit "$(jq -r .number "$RUNNER_TEMP/decision.json")" --repo "$GH_REPO" --body-file "$RUNNER_TEMP/body.md" ;;
              *) echo "filing failed: unsupported decision" >&2; exit 1 ;;
            esac
          done
