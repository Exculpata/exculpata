name: Dependency hygiene audit

on:
  schedule:
    - cron: "57 3 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  measure:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install dependency auditor
        continue-on-error: true
        run: python -m pip install --require-hashes -r requirements/deps-audit.lock
      - name: Measure dependency advisories
        continue-on-error: true
        run: python scripts/hygiene_deps.py --output deps-audit-report.json
      - name: Summarize
        if: always()
        run: |
          echo '## Dependency hygiene audit' >> "$GITHUB_STEP_SUMMARY"
          test -f deps-audit-report.json && python -m json.tool deps-audit-report.json >> "$GITHUB_STEP_SUMMARY" || echo 'Measurement did not produce a report.' >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: deps-audit-report.json
          path: deps-audit-report.json
          if-no-files-found: warn
          retention-days: 14
  file:
    needs: measure
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          token: ""
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: deps-audit-report.json
      - name: File findings when the shared filer is available
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_DENY_TERMS: ${{ secrets.PUBLICATION_DENY_TERMS }}
        run: |
          if [ ! -f scripts/hygiene_issue.py ]; then
            echo 'filing skipped: shared filing script is not available' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          DENY="$RUNNER_TEMP/publication-deny-terms"
          printf '%s' "$PUBLICATION_DENY_TERMS" > "$DENY"
          python scripts/hygiene_issue.py --finding-type vulnerable-deps --label automated-hygiene --title '[hygiene] vulnerable-deps' --report deps-audit-report.json --deny-file "$DENY" --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
