name: Dependency hygiene audit

on:
  schedule:
    - cron: "57 3 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  measure:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install dependency auditor
        continue-on-error: true
        run: python -m pip install --require-hashes -r requirements/deps-audit.lock
      - name: Measure dependency advisories
        continue-on-error: true
        run: python scripts/hygiene_deps.py --output deps-audit-report.json
      - name: Summarize
        if: always()
        run: |
          echo '## Dependency hygiene audit' >> "$GITHUB_STEP_SUMMARY"
          test -f deps-audit-report.json && python -m json.tool deps-audit-report.json >> "$GITHUB_STEP_SUMMARY" || echo 'Measurement did not produce a report.' >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: deps-audit-report.json
          path: deps-audit-report.json
          if-no-files-found: warn
          retention-days: 14
  file:
    needs: measure
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: deps-audit-report.json
      - shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUBLICATION_DENY_TERMS: ${{ secrets.PUBLICATION_DENY_TERMS }}
        run: |
          umask 077
          deny="$RUNNER_TEMP/hygiene-deny"
          trap 'rm -f "$deny"' EXIT
          printf '%s' "$PUBLICATION_DENY_TERMS" > "$deny"
          unset PUBLICATION_DENY_TERMS
          prepare() {
            python3 scripts/hygiene_issue.py --report deps-audit-report.json --issues "$RUNNER_TEMP/issues.json" --kind "$kind" --run "$GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID" --scanner scripts/publication-check.py --deny-file "$deny" --body "$RUNNER_TEMP/body.md" --decision "$RUNNER_TEMP/decision.json" --summary "$GITHUB_STEP_SUMMARY"
          }
          for kind in vulnerable-deps; do
            gh issue list --repo "$GH_REPO" --state open --label automated-hygiene --limit 1000 --json number,title,body,labels,state > "$RUNNER_TEMP/issues.json"
            prepare
            if [ "$(jq -r .action "$RUNNER_TEMP/decision.json")" = skip ]; then continue; fi
            if ! gh label list --search automated-hygiene --limit 1000 --json name | jq -e 'any(.name == "automated-hygiene")' >/dev/null; then
              gh label create automated-hygiene --color ededed --description 'Automated repository hygiene reports'
              prepare
            fi
            case "$(jq -r .action "$RUNNER_TEMP/decision.json")" in
              create) gh issue create --repo "$GH_REPO" --title "$(jq -r .title "$RUNNER_TEMP/decision.json")" --label automated-hygiene --body-file "$RUNNER_TEMP/body.md" ;;
              edit) gh issue edit "$(jq -r .number "$RUNNER_TEMP/decision.json")" --repo "$GH_REPO" --body-file "$RUNNER_TEMP/body.md" ;;
              *) echo "filing failed: unsupported decision" >&2; exit 1 ;;
            esac
          done
