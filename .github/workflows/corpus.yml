name: Synthetic discovery corpus

on:
  pull_request:
  schedule:
    - cron: '43 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpus-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      full_required: ${{ steps.scope.outputs.full_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Classify full corpus changes conservatively
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python - <<'PY'
          import os, subprocess
          base = os.environ.get('BASE_SHA')
          full = True
          if base:
              result = subprocess.run(['git', 'diff', '--no-renames', '--name-only', '-z', base+'...HEAD'], capture_output=True)
              if result.returncode == 0:
                  paths = result.stdout.split(b'\0')
                  documentation = {b'README.md', b'CONTRIBUTING.md', b'CHANGELOG.md', b'LICENSE', b'NOTICE'}
                  full = any(p and not (p in documentation or
                      p.startswith(b'docs/') and p.endswith((b'.md', b'.rst'))) for p in paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('full_required='+str(full).lower()+'\n')
          PY
      - run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Fast product corpus and historical failure proofs
        env:
          CASE_INTELLIGENCE_TEST_MODE: '1'
          CASE_INTELLIGENCE_STORAGE_RESERVE_GIB: '0'
          OMP_NUM_THREADS: '1'
        run: |
          make corpus-check PYTHON=python
          python scripts/corpus-history-check.py
          python -m pytest -q tests/test_corpus_check.py tests/test_corpus_product.py tests/test_corpus_history.py tests/test_corpus_scope.py tests/test_corpus_recognition.py tests/test_corpus_receipts.py

  full:
    needs: fast
    if: github.event_name != 'pull_request' || needs.fast.outputs.full_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install bounded CPU recognition dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg poppler-utils tesseract-ocr tesseract-ocr-eng tesseract-ocr-spa
          python -m pip install --disable-pip-version-check -e . faster-whisper==1.2.1 ctranslate2==4.8.2 huggingface-hub==1.33.0 av==18.1.0
      - name: Stage and verify pinned OCR data
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, subprocess, tempfile, urllib.request
          pin = json.loads(pathlib.Path('benchmarks/corpus/v1/manifest.json').read_text())['models']['ocr']
          for language, digest in pin['sha256'].items():
              url = 'https://raw.githubusercontent.com/'+pin['model_id']+'/'+pin['revision']+'/'+language+'.traineddata'
              with tempfile.TemporaryDirectory() as temporary:
                  target = pathlib.Path(temporary)/(language+'.traineddata')
                  urllib.request.urlretrieve(url, target)
                  assert hashlib.sha256(target.read_bytes()).hexdigest() == digest
                  subprocess.run(['sudo','install','-m','644',str(target),'/usr/share/tesseract-ocr/5/tessdata/'+target.name],check=True)
          PY
      - name: Stage pinned ASR snapshot
        run: python scripts/corpus_recognition.py --stage-models
      - name: Full offline recognition and product corpus
        env:
          CASE_INTELLIGENCE_TEST_MODE: '1'
          CASE_INTELLIGENCE_STORAGE_RESERVE_GIB: '0'
          OMP_NUM_THREADS: '2'
          HF_HUB_OFFLINE: '1'
        run: make corpus-check-full PYTHON=python
