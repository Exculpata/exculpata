name: Quality gates

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  change-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      browser_changed: ${{ steps.scope.outputs.browser_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify complete change conservatively
        id: scope
        run: python3 scripts/classify-quality-change.py

  publication-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact publication head separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact publication checkout
        env:
          EXPECTED_PUBLICATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_PUBLICATION_SHA"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Restore main apt downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !(github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')) }}
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-publication-scan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/quality-gates.yml', 'scripts/install-ci-browser-deps.py') }}
          restore-keys: apt-publication-scan-${{ runner.os }}-${{ runner.arch }}-
      - name: Install publication inspection dependencies
        timeout-minutes: 8
        run: |
          python3 scripts/install-ci-browser-deps.py --archives "$RUNNER_TEMP/apt-archives" ffmpeg
          python -m pip install --disable-pip-version-check 'pypdf>=6,<7'
      - name: Save main apt downloads
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule') }}
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-publication-scan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/quality-gates.yml', 'scripts/install-ci-browser-deps.py') }}
      - name: Scan exact candidate tree and complete reachable history
        if: ${{ !github.event.deleted }}
        env:
          EXPECTED_PUBLICATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PUBLICATION_REF: ${{ github.head_ref && format('refs/heads/{0}', github.head_ref) || github.ref }}
        run: |
          python scripts/check-publication-candidate.py \
            --expected-head "$EXPECTED_PUBLICATION_SHA" \
            --publication-ref "$PUBLICATION_REF"

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified secret scanner
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan fetched history without publishing matched values
        run: |
          if ! /tmp/gitleaks git --redact --no-banner --log-opts='--all' > /tmp/secret-scan.log 2>&1; then
            echo 'Secret scan blocked. Maintainer must inspect privately; no matched values or artifacts uploaded.'
            exit 1
          fi
      - name: Verify exact historical exception and synthetic detection controls
        env:
          GITLEAKS: /tmp/gitleaks
        run: python3 tests/test_gitleaks_exception.py

  application:
    needs: [change-scope, application-shards]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful classification and both application shards
        env:
          SCOPE_RESULT: ${{ needs.change-scope.result }}
          SHARD_RESULT: ${{ needs.application-shards.result }}
        run: test "$SCOPE_RESULT" = success && test "$SHARD_RESULT" = success

  application-shards:
    needs: [change-scope]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - name: Require successful classification
        env:
          SCOPE_RESULT: ${{ needs.change-scope.result }}
        run: test "$SCOPE_RESULT" = success
      - name: Check out integration candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify integration checkout
        env:
          EXPECTED_INTEGRATION_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_INTEGRATION_SHA"
      - name: Select Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            services/transcription/pyproject.toml
      - name: Protect reviewed corpus inputs
        run: bash scripts/corpus-write-guard.sh prepare
      - name: Install lightweight documentation test dependencies
        if: ${{ needs.change-scope.outputs.docs_only == 'true' }}
        # Generated with uv 0.11.16 using docs/DEPENDENCIES.md's resolution flags,
        # constrained by application-test.lock and the pyproject.toml parser pins.
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r /dev/stdin <<'REQUIREMENTS'
          anyio==4.15.1 \
              --hash=sha256:6152fdbbf9a77fdec97731721bebf7c4c44f7c29b424b0065826173efc7ed101 \
              --hash=sha256:9f28306018cbd6d329e64a36d58256edff76dd996fe423bc957326e578b82a94
          idna==3.20 \
              --hash=sha256:a7db850025b95ded1eae8a46181a1a6c56c92c96f0e2b005d9ff8dc0210cab44 \
              --hash=sha256:ab7ae7122974553370f0bdb919e1a960b2cd1bc1ef0276416d896db81c14582c
          iniconfig==2.3.0 \
              --hash=sha256:c76315c77db068650d49c5b56314774a7804df16fee4402c1f19d6d15d8c4730 \
              --hash=sha256:f631c04d2c48c52b84d0d0549c99ff3859c98df65b3101406327ecc7d53fbf12
