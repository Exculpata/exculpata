              --hash=sha256:622a69d677aa7f6ee2931d8c77c981a33f0ebb6d275aa9d43d3397c879a9bb0b \
              --hash=sha256:8264a996b8845cfce06965152a013b5d9cbb7d199bc3503e12b5682e62bb1de1 \
              --hash=sha256:9dc04ba91fc8583344e57c1f1ed5b2c97ecaaf47480011b92fbeab8dda96db75 \
              --hash=sha256:b70f887fb269d6e58c349d683f59fa647140c410cfe2bee44a883b20ec92e3dc \
              --hash=sha256:dfcf789064c58dc13c0a4edb550acacfc6f0f280577f1e7a00de3e89fc7f8ddc \
              --hash=sha256:e5ed840f5bd4a3f0272e441d19429b26eedc257abe5574c8546da6b556865e3c
          typing-extensions==4.16.0 \
              --hash=sha256:481caa481374e813c1b176ada14e97f1f67a4539ce9cfeb3f350d78d6370c2e8 \
              --hash=sha256:dc983d19a509c94dba722ee6abd33940f7c05a89e243c47e907eb4db6f1a43e5
          REQUIREMENTS
      - name: Run documentation and scope contracts
        if: ${{ needs.change-scope.outputs.docs_only == 'true' }}
        run: python -m pytest -q tests/test_documentation.py tests/test_quality_change_scope.py
      - name: Record documentation-only acceptance
        if: ${{ needs.change-scope.outputs.docs_only == 'true' }}
        run: echo 'Documentation and scope contracts passed; the full application suite is not applicable. Publication and secret checks remain required.' >> "$GITHUB_STEP_SUMMARY"
      # Main push/schedule runs are the only cache writers; PR and merge_group runs restore read-only.
      # Apt update/install always run.
      - name: Restore main apt downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ (!(github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule'))) && needs.change-scope.outputs.docs_only != 'true' }}
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-application-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/quality-gates.yml', 'scripts/install-ci-browser-deps.py') }}
          restore-keys: apt-application-${{ runner.os }}-${{ runner.arch }}-
      - name: Install document and media test dependencies
        timeout-minutes: 8
        if: ${{ needs.change-scope.outputs.docs_only != 'true' }}
        run: |
          python3 scripts/install-ci-browser-deps.py --archives "$RUNNER_TEMP/apt-archives" ffmpeg imagemagick poppler-utils tesseract-ocr \
            tesseract-ocr-eng tesseract-ocr-spa
      - name: Save main apt downloads
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')) && needs.change-scope.outputs.docs_only != 'true' }}
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-application-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/quality-gates.yml', 'scripts/install-ci-browser-deps.py') }}
      - name: Bootstrap contributor environment
        if: ${{ needs.change-scope.outputs.docs_only != 'true' }}
        run: make bootstrap SYSTEM_PYTHON=python
      - name: Verify repeatable setup
        if: ${{ github.event_name == 'schedule' }}
        run: make bootstrap SYSTEM_PYTHON=python
      - name: Compile Python sources
        if: ${{ needs.change-scope.outputs.docs_only != 'true' }}
        run: .venv/bin/python -m compileall -q src scripts tests
      - name: Check unused imports and locals
        if: ${{ needs.change-scope.outputs.docs_only != 'true' }}
        run: .venv/bin/python -m ruff check src services scripts tests
      - name: Enforce repository network contract
        if: ${{ needs.change-scope.outputs.docs_only != 'true' }}
        run: make network-contract
      - name: Select application test shard
        if: ${{ needs.change-scope.outputs.docs_only != 'true' }}
        run: .venv/bin/python scripts/application-test-shard.py ${{ matrix.shard }} > "$RUNNER_TEMP/application-test-files.txt"
      - name: Run application suite
        if: ${{ needs.change-scope.outputs.docs_only != 'true' }}
        env:
          # Hosted runners are intentionally smaller than supported review nodes.
          # Production keeps the 100 GiB default from config/exculpata.env.example.
          # Reserve 0 starts only with the explicit test switch.
          CASE_INTELLIGENCE_STORAGE_RESERVE_GIB: "0"
          CASE_INTELLIGENCE_TEST_MODE: "1"
          PYTEST_XDIST_AUTO_NUM_WORKERS: "6"
          # xdist already occupies the runner CPUs. Bound each worker's native
          # OCR/numerical thread pools instead of multiplying runnable threads.
          OMP_THREAD_LIMIT: "1"
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
        # Unbuffered verbose output identifies failed/active nodes before timeout.
        # Captured streams stay private; only synthetic failure tracebacks are shown.
        run: >-
          .venv/bin/python -u -m pytest -n auto --dist loadgroup --max-worker-restart=0 -v --tb=short --show-capture=no -m "not postgres"
          --timeout=360 --timeout-method=signal
          -ra --durations=25 -o junit_logging=no
          --junitxml="${{ runner.temp }}/application-results.xml"
          --worker-diagnostics-dir="${{ runner.temp }}/application-workers"
          @"${{ runner.temp }}/application-test-files.txt"
      - name: Verify reviewed corpus inputs are unchanged
        if: ${{ always() }}
        run: bash scripts/corpus-write-guard.sh check
      - name: Retain application test report
        if: ${{ always() && needs.change-scope.outputs.docs_only != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: application-results-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/application-results.xml
            ${{ runner.temp }}/application-workers/*.json
          if-no-files-found: warn
          retention-days: 5

  postgres-integration:
    needs: change-scope
    if: ${{ always() && (needs.change-scope.result != 'success' || needs.change-scope.outputs.docs_only != 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        # PostgreSQL 17 + pgvector, pinned independently of deployment updates.
        image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_USER: exculpata
          POSTGRES_DB: exculpata_test
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U exculpata -d exculpata_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CASE_REVIEW_POSTGRES_TEST_DSN: postgresql://exculpata:synthetic-ci-only@127.0.0.1:5432/exculpata_test
    steps:
      - name: Require successful classification
        env:
          SCOPE_RESULT: ${{ needs.change-scope.result }}
        run: test "$SCOPE_RESULT" = success
      - name: Check out integration candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify integration checkout
        env:
          EXPECTED_INTEGRATION_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_INTEGRATION_SHA"
      - name: Select Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install database test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev,postgres]'
      - name: Run existing PostgreSQL and pgvector acceptance
        env:
          CASE_REVIEW_POSTGRES_CLIENT_PREFIX: docker exec -i ${{ job.services.postgres.id }}
        # Learned-model acceptance remains a separate, explicitly excluded gate.
        run: |
          python -m pytest -q tests/test_review_bench_v2_postgres.py tests/test_defense_eval_postgres.py \
            tests/test_case_theory_schema.py tests/test_case_theory_reindex.py tests/test_case_theory.py \
            --deselect tests/test_review_bench_v2_postgres.py::test_live_learned_dense_only_paraphrase_and_unsupported_abstention \
            --junitxml="$RUNNER_TEMP/postgres-results.xml"
          python scripts/check-postgres-test-report.py "$RUNNER_TEMP/postgres-results.xml"

  defense-eval:
    # Independent of change-scope: even documentation-only PRs get scorecards.
    if: ${{ always() }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_USER: exculpata
          POSTGRES_DB: exculpata_test
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U exculpata -d exculpata_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CASE_REVIEW_POSTGRES_TEST_DSN: postgresql://exculpata:synthetic-ci-only@127.0.0.1:5432/exculpata_test
    steps:
      - name: Check out candidate and complete base history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify integration checkout
        env:
          EXPECTED_INTEGRATION_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_INTEGRATION_SHA"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Write lexical stub and product retrieval scorecards plus main delta
        env:
          EXPECTED_BASE_SHA: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
        run: >-
          python scripts/defense-eval-ci.py
          --locked-environments
          --base-sha "$EXPECTED_BASE_SHA"
          --output-dir "$RUNNER_TEMP/defense-eval-artifacts"
          --work-root "$RUNNER_TEMP"
      - name: Retain scorecards, comparison and provenance even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: defense-eval-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/defense-eval-artifacts
          if-no-files-found: error
          retention-days: 5

  transcription:
    needs: change-scope
    if: ${{ always() && (needs.change-scope.result != 'success' || needs.change-scope.outputs.docs_only != 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require successful classification
        env:
          SCOPE_RESULT: ${{ needs.change-scope.result }}
        run: test "$SCOPE_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify integration checkout
        env:
          EXPECTED_INTEGRATION_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_INTEGRATION_SHA"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/transcription/pyproject.toml
      - name: Restore main apt downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !(github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')) }}
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-transcription-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/quality-gates.yml', 'scripts/install-ci-browser-deps.py') }}
          restore-keys: apt-transcription-${{ runner.os }}-${{ runner.arch }}-
      - name: Install media test dependencies
        timeout-minutes: 8
        run: |
          python3 scripts/install-ci-browser-deps.py --archives "$RUNNER_TEMP/apt-archives" ffmpeg
      - name: Save main apt downloads
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule') }}
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-transcription-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/quality-gates.yml', 'scripts/install-ci-browser-deps.py') }}
      - name: Install transcription test environment
        run: python -m pip install --disable-pip-version-check -e './services/transcription[dev]'
      - name: Run bundled transcription suite
        working-directory: services/transcription
        run: python -m pytest -q -o addopts=''

  deployment-contract:
    # This existing required check keeps publication failure blocking while the
    # application suite runs concurrently; branch protection remains unchanged.
    needs: [change-scope, publication-scan]
    if: ${{ always() && (needs.change-scope.result != 'success' || needs.publication-scan.result != 'success' || needs.change-scope.outputs.docs_only != 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require successful classification and publication scan
        env:
          SCOPE_RESULT: ${{ needs.change-scope.result }}
          PUBLICATION_RESULT: ${{ needs.publication-scan.result }}
        run: test "$SCOPE_RESULT" = success && test "$PUBLICATION_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify integration checkout
        env:
          EXPECTED_INTEGRATION_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_INTEGRATION_SHA"
      - name: Validate standard and Kerberos Compose graphs
        run: ./scripts/compose-check.sh
      - name: Verify real gateway strips forged authentication headers
        run: PYTHONPATH=src python3 -m unittest tests.test_gateway_nginx -v
      - name: Select Python 3.12 for restore acceptance
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Restore main apt downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !(github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')) }}
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-deployment-contract-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/quality-gates.yml', 'scripts/install-ci-browser-deps.py') }}
          restore-keys: apt-deployment-contract-${{ runner.os }}-${{ runner.arch }}-
      - name: Install encrypted restore drill dependencies
        timeout-minutes: 8
        run: |
          python3 scripts/install-ci-browser-deps.py --archives "$RUNNER_TEMP/apt-archives" restic
          # Seed and reopen restored matter fields through the real application store.
          python -m pip install --disable-pip-version-check -e . 'pytest>=9.0.3,<10'
          image=pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
          docker pull "$image"
          docker tag "$image" pgvector/pgvector:pg17
      - name: Save main apt downloads
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule') }}
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-deployment-contract-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/quality-gates.yml', 'scripts/install-ci-browser-deps.py') }}
      - name: Run both encrypted restore naming generations without skips
        env:
          EXCULPATA_BACKUP_INTEGRATION: "1"
        run: |
          python -m pytest -q -o addopts='' \
            tests/test_backup_consistency.py::test_encrypted_split_snapshot_and_postgres_restore \
            --junitxml="$RUNNER_TEMP/restore-results.xml"
          python - "$RUNNER_TEMP/restore-results.xml" <<'PYCODE'
          import sys
          import xml.etree.ElementTree as ET

          cases = list(ET.parse(sys.argv[1]).getroot().iter("testcase"))
          expected = {f"test_encrypted_split_snapshot_and_postgres_restore[{names}]"
                      for names in ("recordbench", "exculpata")}
          if len(cases) != 2 or {case.get("name") for case in cases} != expected:
              raise SystemExit("Restore acceptance requires both naming generations")
          if any(case.find(outcome) is not None for case in cases
                 for outcome in ("skipped", "failure", "error")):
              raise SystemExit("Restore acceptance must pass without skips")
          print("Restore acceptance: 2 passed, zero skipped")
          PYCODE
      - name: Exercise read-only installer diagnostics
        run: |
          python3 - <<'PYCODE'
          import json
          import pathlib
          import subprocess
          import tempfile

          with tempfile.TemporaryDirectory() as temporary:
              root = pathlib.Path(temporary) / "uncreated node"
              result = subprocess.run(
                  ["./install", "preflight", "--root", str(root), "--models", "none", "--json"],
                  capture_output=True, text=True, timeout=90,
              )
              payload = json.loads(result.stdout)
              assert payload["schema_version"] == 1
              assert payload["checks"]
              blocked = any(row["blocking"] and row["state"] != "pass" for row in payload["checks"])
              assert payload["ready"] is (not blocked)
              assert result.returncode == (1 if blocked else 0)
              assert all(row["remedy"] for row in payload["checks"] if row["blocking"] and row["state"] != "pass")
              assert not root.exists()
          PYCODE

  synthetic-browser:
    needs: change-scope
    if: >-
      ${{ always() && (
        (contains(fromJSON('["merge_group", "schedule", "workflow_dispatch"]'), github.event_name) &&
          (needs.change-scope.result != 'success' || needs.change-scope.outputs.docs_only != 'true')) ||
        (github.event_name == 'pull_request' &&
          (needs.change-scope.result != 'success' || needs.change-scope.outputs.browser_changed != 'false'))
      ) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require successful classification
        env:
          SCOPE_RESULT: ${{ needs.change-scope.result }}
        run: test "$SCOPE_RESULT" = success
      - name: Check out integration candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify integration checkout
        env:
          EXPECTED_INTEGRATION_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_INTEGRATION_SHA"
      - name: Select Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install browser and media runtimes and contributor dependencies
        timeout-minutes: 10
        run: |
          python scripts/install-ci-browser-deps.py
          test -x /usr/bin/ffprobe
          test -x /usr/bin/ffmpeg
          python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Verify browser runner failure contracts
        run: python -m pytest -q tests/test_browser_acceptance_runner.py
      - name: Run pinned synthetic intake and Report journeys
        run: python scripts/run-browser-acceptance.py --output "$RUNNER_TEMP/exculpata-browser-artifacts"
      - name: Retain bounded synthetic diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exculpata-browser-artifacts
          if-no-files-found: warn
          retention-days: 5
