name: Quality gates

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  change-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify complete change conservatively
        id: scope
        run: python3 scripts/classify-quality-change.py

  publication-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact publication head separately
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact publication checkout
        env:
          EXPECTED_PUBLICATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_PUBLICATION_SHA"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Install publication inspection dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          python -m pip install --disable-pip-version-check 'pypdf>=6,<7'
      - name: Scan exact candidate tree and complete reachable history
        if: ${{ !github.event.deleted }}
        env:
          EXPECTED_PUBLICATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PUBLICATION_REF: ${{ github.head_ref && format('refs/heads/{0}', github.head_ref) || github.ref }}
        run: |
          python scripts/check-publication-candidate.py \
            --expected-head "$EXPECTED_PUBLICATION_SHA" \
            --publication-ref "$PUBLICATION_REF"

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified secret scanner
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan fetched history without publishing matched values
        run: |
          if ! /tmp/gitleaks git --redact --no-banner --log-opts='--all' > /tmp/secret-scan.log 2>&1; then
            echo 'Secret scan blocked. Maintainer must inspect privately; no matched values or artifacts uploaded.'
            exit 1
          fi

  application:
    needs: [change-scope]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require successful classification
        env:
          SCOPE_RESULT: ${{ needs.change-scope.result }}
        run: test "$SCOPE_RESULT" = success
      - name: Check out integration candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify integration checkout
        env:
          EXPECTED_INTEGRATION_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_INTEGRATION_SHA"
      - name: Select Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            services/transcription/pyproject.toml
      - name: Install lightweight documentation test dependencies
        if: ${{ needs.change-scope.outputs.docs_only == 'true' }}
        run: python -m pip install --disable-pip-version-check 'pytest>=9.0.3,<10'
      - name: Run documentation and scope contracts
        if: ${{ needs.change-scope.outputs.docs_only == 'true' }}
        run: python -m pytest -q tests/test_documentation.py tests/test_quality_change_scope.py
      - name: Record documentation-only acceptance
        if: ${{ needs.change-scope.outputs.docs_only == 'true' }}
        run: echo 'Documentation and scope contracts passed; the full application suite is not applicable. Publication and secret checks remain required.' >> "$GITHUB_STEP_SUMMARY"
      # Only trusted main runs share apt archives; PRs install from fresh signed indexes.
      # Cache downloads only: apt update/install always run, including on cache hits.
      - name: Cache trusted apt downloads
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.change-scope.outputs.docs_only != 'true' }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-application-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageVersion }}-${{ hashFiles('.github/workflows/quality-gates.yml') }}
      - name: Install document and media test dependencies
        if: ${{ needs.change-scope.outputs.docs_only != 'true' }}
        run: |
          mkdir -p "$RUNNER_TEMP/apt-archives/partial"
          sudo apt-get update
          sudo apt-get -o Dir::Cache::archives="$RUNNER_TEMP/apt-archives" \
            -o APT::Keep-Downloaded-Packages=true install --yes --no-install-recommends \
            ffmpeg imagemagick poppler-utils tesseract-ocr \
            tesseract-ocr-eng tesseract-ocr-spa
      - name: Bootstrap contributor environment
        if: ${{ needs.change-scope.outputs.docs_only != 'true' }}
        run: make bootstrap SYSTEM_PYTHON=python
      - name: Verify repeatable setup
        if: ${{ github.event_name == 'schedule' }}
        run: make bootstrap SYSTEM_PYTHON=python
      - name: Compile Python sources
        if: ${{ needs.change-scope.outputs.docs_only != 'true' }}
        run: .venv/bin/python -m compileall -q src scripts tests
      - name: Run application suite
        if: ${{ needs.change-scope.outputs.docs_only != 'true' }}
        env:
          # Hosted runners are intentionally smaller than supported review nodes.
          # Production keeps the 100 GiB default from recordbench.env.example.
          CASE_INTELLIGENCE_STORAGE_RESERVE_GIB: "0"
          # A bounded pool overlaps SQLite/filesystem waits on the same hosted
          # runner; xdist's documented auto-worker override retains -n auto.
          PYTEST_XDIST_AUTO_NUM_WORKERS: "6"
          # xdist already occupies the runner CPUs. Bound each worker's native
          # OCR/numerical thread pools instead of multiplying runnable threads.
          OMP_THREAD_LIMIT: "1"
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
        # Unbuffered verbose output identifies failed/active nodes before timeout.
        # Captured streams stay private; only synthetic failure tracebacks are shown.
        run: >-
          .venv/bin/python -u -m pytest -n auto --dist loadgroup --max-worker-restart=0 -v --tb=short --show-capture=no
          -ra --durations=25 -o junit_logging=no
          --junitxml="${{ runner.temp }}/application-results.xml"
      - name: Retain application test report
        if: ${{ always() && needs.change-scope.outputs.docs_only != 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: application-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/application-results.xml
          if-no-files-found: warn
          retention-days: 5

  postgres-integration:
    needs: change-scope
    if: ${{ always() && (needs.change-scope.result != 'success' || needs.change-scope.outputs.docs_only != 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        # PostgreSQL 17 + pgvector, pinned independently of deployment updates.
        image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_USER: recordbench
          POSTGRES_DB: recordbench_test
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U recordbench -d recordbench_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CASE_REVIEW_POSTGRES_TEST_DSN: postgresql://recordbench:synthetic-ci-only@127.0.0.1:5432/recordbench_test
    steps:
      - name: Require successful classification
        env:
          SCOPE_RESULT: ${{ needs.change-scope.result }}
        run: test "$SCOPE_RESULT" = success
      - name: Check out integration candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Verify integration checkout
        env:
          EXPECTED_INTEGRATION_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_INTEGRATION_SHA"
      - name: Select Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install database test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev,postgres]'
      - name: Run existing PostgreSQL and pgvector acceptance
        # Learned-model acceptance remains a separate, explicitly excluded gate.
        run: |
          python -m pytest -q tests/test_review_bench_v2_postgres.py \
            --deselect tests/test_review_bench_v2_postgres.py::test_live_learned_dense_only_paraphrase_and_unsupported_abstention \
            --junitxml="$RUNNER_TEMP/postgres-results.xml"
          python scripts/check-postgres-test-report.py "$RUNNER_TEMP/postgres-results.xml"

  transcription:
    needs: change-scope
    if: ${{ always() && (needs.change-scope.result != 'success' || needs.change-scope.outputs.docs_only != 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require successful classification
        env:
          SCOPE_RESULT: ${{ needs.change-scope.result }}
        run: test "$SCOPE_RESULT" = success
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify integration checkout
        env:
          EXPECTED_INTEGRATION_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_INTEGRATION_SHA"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/transcription/pyproject.toml
      - name: Install media test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Install transcription test environment
        run: python -m pip install --disable-pip-version-check -e './services/transcription[dev]'
      - name: Run bundled transcription suite
        working-directory: services/transcription
        run: python -m pytest -q -o addopts=''

  deployment-contract:
    # This existing required check keeps publication failure blocking while the
    # application suite runs concurrently; branch protection remains unchanged.
    needs: [change-scope, publication-scan]
    if: ${{ always() && (needs.change-scope.result != 'success' || needs.publication-scan.result != 'success' || needs.change-scope.outputs.docs_only != 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require successful classification and publication scan
        env:
          SCOPE_RESULT: ${{ needs.change-scope.result }}
          PUBLICATION_RESULT: ${{ needs.publication-scan.result }}
        run: test "$SCOPE_RESULT" = success && test "$PUBLICATION_RESULT" = success
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify integration checkout
        env:
          EXPECTED_INTEGRATION_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_INTEGRATION_SHA"
      - name: Validate standard and Kerberos Compose graphs
        run: ./scripts/compose-check.sh
      - name: Verify real gateway strips forged authentication headers
        run: python3 -m unittest tests.test_gateway_nginx -v
      - name: Select Python 3.12 for restore acceptance
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install encrypted restore drill dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends restic
          python -m pip install --disable-pip-version-check 'pytest>=9.0.3,<10'
          image=pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
          docker pull "$image"
          docker tag "$image" pgvector/pgvector:pg17
      - name: Run both encrypted restore naming generations without skips
        env:
          RECORDBENCH_BACKUP_INTEGRATION: "1"
        run: |
          python -m pytest -q -o addopts='' \
            tests/test_backup_consistency.py::test_encrypted_split_snapshot_and_postgres_restore \
            --junitxml="$RUNNER_TEMP/restore-results.xml"
          python - "$RUNNER_TEMP/restore-results.xml" <<'PYCODE'
          import sys
          import xml.etree.ElementTree as ET

          cases = list(ET.parse(sys.argv[1]).getroot().iter("testcase"))
          expected = {f"test_encrypted_split_snapshot_and_postgres_restore[{names}]"
                      for names in ("recordbench", "exculpata")}
          if len(cases) != 2 or {case.get("name") for case in cases} != expected:
              raise SystemExit("Restore acceptance requires both naming generations")
          if any(case.find(outcome) is not None for case in cases
                 for outcome in ("skipped", "failure", "error")):
              raise SystemExit("Restore acceptance must pass without skips")
          print("Restore acceptance: 2 passed, zero skipped")
          PYCODE
      - name: Exercise read-only installer diagnostics
        run: |
          python3 - <<'PYCODE'
          import json
          import pathlib
          import subprocess
          import tempfile

          with tempfile.TemporaryDirectory() as temporary:
              root = pathlib.Path(temporary) / "uncreated node"
              result = subprocess.run(
                  ["./install", "preflight", "--root", str(root), "--models", "none", "--json"],
                  capture_output=True, text=True, timeout=90,
              )
              payload = json.loads(result.stdout)
              assert payload["schema_version"] == 1
              assert payload["checks"]
              blocked = any(row["blocking"] and row["state"] != "pass" for row in payload["checks"])
              assert payload["ready"] is (not blocked)
              assert result.returncode == (1 if blocked else 0)
              assert all(row["remedy"] for row in payload["checks"] if row["blocking"] and row["state"] != "pass")
              assert not root.exists()
          PYCODE

  synthetic-browser:
    needs: change-scope
    if: ${{ always() && contains(fromJSON('["merge_group", "schedule", "workflow_dispatch"]'), github.event_name) && (needs.change-scope.result != 'success' || needs.change-scope.outputs.docs_only != 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require successful classification
        env:
          SCOPE_RESULT: ${{ needs.change-scope.result }}
        run: test "$SCOPE_RESULT" = success
      - name: Check out integration candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Verify integration checkout
        env:
          EXPECTED_INTEGRATION_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_INTEGRATION_SHA"
      - name: Select Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install browser and media runtimes and contributor dependencies
        run: |
          python scripts/install-ci-browser-deps.py
          test -x /usr/bin/ffprobe
          test -x /usr/bin/ffmpeg
          python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Verify browser runner failure contracts
        run: python -m pytest -q tests/test_browser_acceptance_runner.py
      - name: Run pinned synthetic intake and Report journeys
        run: python scripts/run-browser-acceptance.py --output "$RUNNER_TEMP/recordbench-browser-artifacts"
      - name: Retain bounded synthetic diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recordbench-browser-artifacts
          if-no-files-found: warn
          retention-days: 5
