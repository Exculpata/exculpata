[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "exculpata"
version = "0.1.0b1"
description = "Local-first evidence and matter review workbench for Exculpata"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "anyio>=4.0,<5",
  "argon2-cffi>=23.1,<26",
  # 1.8.0 warns on import that its httpx integration is deprecated in favor of
  # httpx2. Installed commands print that warning on stderr, including --help.
  "authlib>=1.7.2,<1.8",
  "fastapi>=0.141.1,<0.143",
  "starlette>=1.3.1,<2",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "jsonschema>=4,<5",
  "pydantic>=2,<3",
  "pypdf>=6,<7",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.35,<1",
  # 2.0.14.post1 reports __version__ 2.0.14.post1. Speech preflight requires
  # exactly 2.0.14; any other version makes the check unavailable.
  "webrtcvad-wheels==2.0.14",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "pytest-xdist>=3.8,<4", "selenium>=4.29,<5"]
postgres = ["psycopg[binary]>=3.2,<4"]
models = ["sentence-transformers>=5,<7"]

[project.scripts]
exculpata = "case_intelligence.cli:admin"
exculpata-workbench = "case_intelligence.cli:workbench"
exculpata-retrieval-worker = "case_intelligence.cli:retrieval_worker"
case-review-bench = "case_intelligence.cli:review_bench"
case-intelligence-workbench = "case_intelligence.cli:workbench"
recordbench = "case_intelligence.cli:admin"
recordbench-workbench = "case_intelligence.cli:workbench"
recordbench-retrieval-worker = "case_intelligence.cli:retrieval_worker"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
case_intelligence = [
  "demo_data/*.json",
  "demo_data/*.pdf",
  "demo_data/sources/*/*",
  "demo_data/sources/*/*/*",
  "docx_extract_helper.py",
  "migrations/postgresql/*.sql",
  "migrations/sqlite/*.sql",
  "static/*",
  "templates/*.html",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
